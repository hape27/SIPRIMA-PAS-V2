name: SIPRIMA PAS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://siprima:siprima_ci_password@localhost:5432/siprima_pas
      JWT_SECRET: ci-test-secret-change-me-32-characters-minimum
      CORS_ORIGIN: http://localhost

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: siprima_pas
          POSTGRES_USER: siprima
          POSTGRES_PASSWORD: siprima_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U siprima -d siprima_pas"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy Prisma migrations
        run: npm run prisma:deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: siprima-pas-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: siprima-pas-frontend:ci

  postgres-baseline:
    name: Verify PostgreSQL Baseline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://siprima:siprima_ci_password@localhost:5432/siprima_pas

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: siprima_pas
          POSTGRES_USER: siprima
          POSTGRES_PASSWORD: siprima_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U siprima -d siprima_pas"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy committed baseline migration
        run: npm run prisma:deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Verify migration file
        run: |
          test -s prisma/migrations/20261005000000_init_baseline/migration.sql

          echo "=== BASELINE SIZE ==="
          wc -l prisma/migrations/20261005000000_init_baseline/migration.sql

          echo "=== CREATE TABLE COUNT ==="
          test "$(grep -c 'CREATE TABLE' prisma/migrations/20261005000000_init_baseline/migration.sql)" -eq 29

          echo "=== CREATE TYPE COUNT ==="
          test "$(grep -c 'CREATE TYPE' prisma/migrations/20261005000000_init_baseline/migration.sql)" -eq 6

          echo "=== DATETIME CHECK ==="
          if grep -ni 'DATETIME' prisma/migrations/20261005000000_init_baseline/migration.sql; then
            echo "ERROR: DATETIME ditemukan"
            exit 1
          else
            echo "OK: tidak ada DATETIME"
          fi

          echo "=== BASELINE VERIFICATION PASSED ==="
