name: SIPRIMA PAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://siprima:siprima@localhost:5432/siprima_pas
      JWT_SECRET: ci-test-secret-change-me
      CORS_ORIGIN: http://localhost

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: siprima-pas-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: siprima-pas-frontend:ci

  postgres-baseline:
    name: Generate PostgreSQL Baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate PostgreSQL baseline SQL
        run: |
          mkdir -p ../artifacts
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > ../artifacts/postgresql-baseline.sql
      - name: Verify baseline
        run: |
          test -s ../artifacts/postgresql-baseline.sql
          echo "=== BASELINE SIZE ==="
          wc -l ../artifacts/postgresql-baseline.sql
          echo "=== CREATE TABLE COUNT ==="
          grep -c "CREATE TABLE" ../artifacts/postgresql-baseline.sql
          echo "=== CREATE TYPE COUNT ==="
          grep -c "CREATE TYPE" ../artifacts/postgresql-baseline.sql
      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: siprima-postgresql-baseline
          path: artifacts/postgresql-baseline.sql
  postgres-baseline-inspect:
    name: Inspect PostgreSQL Baseline
    runs-on: ubuntu-latest
    needs: [postgres-baseline]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate baseline
        working-directory: backend
        run: |
          mkdir -p ../artifacts
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > ../artifacts/postgresql-baseline.sql

      - name: Inspect baseline
        run: |
          echo "=== BASELINE FILE ==="
          wc -l artifacts/postgresql-baseline.sql
          echo
          echo "=== CREATE TABLE COUNT ==="
          grep -c "CREATE TABLE" artifacts/postgresql-baseline.sql
          echo
          echo "=== CREATE TYPE COUNT ==="
          grep -c "CREATE TYPE" artifacts/postgresql-baseline.sql
          echo
          echo "=== DATETIME CHECK ==="
          if grep -ni "DATETIME" artifacts/postgresql-baseline.sql; then
            echo "ERROR: DATETIME ditemukan"
            exit 1
          else
            echo "OK: tidak ada DATETIME"
          fi
          echo
          echo "=== TABLE LIST ==="
          grep -E "^CREATE TABLE" artifacts/postgresql-baseline.sql
          echo
          echo "=== TYPE LIST ==="
          grep -E "^CREATE TYPE" artifacts/postgresql-baseline.sql
