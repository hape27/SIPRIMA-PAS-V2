services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siprima_pas}
      POSTGRES_USER: ${POSTGRES_USER:-siprima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["siprima_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siprima} -d ${POSTGRES_DB:-siprima_pas}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-siprima}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-siprima_pas}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      UPLOAD_DIR: /app/uploads
      PORT: 4000
    volumes: ["siprima_uploads:/app/uploads"]
    depends_on: {db: {condition: service_healthy}}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [backend]
volumes:
  siprima_pgdata:
  siprima_uploads:
